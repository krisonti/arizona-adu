[build]
  publish = "."
  functions = "netlify/functions"

# ADU re-engagement drip — runs daily at 9:00 AM Phoenix time (16:00 UTC; Arizona has no DST).
# It only emails leads whose Monday "Drip Status" is Active and whose last email was 14+ days ago.
[functions."re-engage"]
  schedule = "0 16 * * *"
